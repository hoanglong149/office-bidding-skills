<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sơ đồ khối · bản in</title>
  <style>
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #16314d;
      --color-muted:  #5c7c8e;
      --color-accent: #1f6a99;
      --color-line:   #9fb3c4;
    }
    body { margin: 0; background: var(--color-paper); }
  </style>
</head>
<body>
<svg viewBox="0 0 880 420" width="880" height="420" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="block-title block-desc" font-family="Arial, sans-serif">
  <title id="block-title">Sơ đồ khối hệ thống</title>
  <desc id="block-desc">Sơ đồ khối bốn bước, có một nhánh sản phẩm phụ.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6a99"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c7c8e"/>
    </marker>
  </defs>

  <!-- ===== hàng 1: 4 khối ===== -->
  <g>
    <rect x="20" y="90" width="190" height="86" rx="6" fill="#ffffff" stroke="#5c7c8e" stroke-width="1.2"/>
    <text x="115" y="122" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">Khí Off-Gas</text>
    <text x="115" y="146" text-anchor="middle" font-size="14" fill="#5c7c8e">TP-01 · 15,1 barg</text>
    <text x="115" y="164" text-anchor="middle" font-size="14" fill="#5c7c8e">41 °C</text>

    <rect x="246" y="90" width="180" height="86" rx="6" fill="#ffffff" stroke="#5c7c8e" stroke-width="1.2"/>
    <text x="336" y="122" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">Đo đếm &amp; lọc bụi</text>
    <text x="336" y="146" text-anchor="middle" font-size="14" fill="#5c7c8e">kiểm soát lưu lượng</text>
    <text x="336" y="164" text-anchor="middle" font-size="14" fill="#5c7c8e">và áp suất</text>

    <rect x="462" y="90" width="180" height="86" rx="6" fill="#ffffff" stroke="#1f6a99" stroke-width="1.8"/>
    <text x="552" y="122" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">PSA sơ cấp</text>
    <text x="552" y="146" text-anchor="middle" font-size="14" fill="#5c7c8e">10-T-6001 · loại &gt;90% CH₄</text>
    <text x="552" y="164" text-anchor="middle" font-size="14" fill="#5c7c8e">loại 40% NH₃</text>

    <rect x="678" y="90" width="182" height="86" rx="6" fill="#eef4f9" stroke="#1f6a99" stroke-width="1.2"/>
    <text x="769" y="122" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">Khí CH₄</text>
    <text x="769" y="146" text-anchor="middle" font-size="14" fill="#5c7c8e">tuần hoàn về xưởng</text>
    <text x="769" y="164" text-anchor="middle" font-size="14" fill="#5c7c8e">Urea / Hạng mục</text>
  </g>

  <!-- ===== hàng 2: 3 khối ===== -->
  <g>
    <rect x="246" y="286" width="180" height="86" rx="6" fill="#ffffff" stroke="#5c7c8e" stroke-width="1.2"/>
    <text x="336" y="318" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">Nước rửa</text>
    <text x="336" y="342" text-anchor="middle" font-size="14" fill="#5c7c8e">10-T-6002</text>
    <text x="336" y="360" text-anchor="middle" font-size="14" fill="#5c7c8e">thu hồi về xưởng NH₃</text>

    <rect x="462" y="286" width="180" height="86" rx="6" fill="#ffffff" stroke="#1f6a99" stroke-width="1.8"/>
    <text x="552" y="318" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">PSA thứ cấp</text>
    <text x="552" y="342" text-anchor="middle" font-size="14" fill="#5c7c8e">chưng cất lạnh</text>
    <text x="552" y="360" text-anchor="middle" font-size="14" fill="#5c7c8e">10-Z-6001</text>

    <rect x="678" y="286" width="182" height="86" rx="6" fill="#eef4f9" stroke="#1f6a99" stroke-width="1.2"/>
    <text x="769" y="318" text-anchor="middle" font-size="20" font-weight="600" fill="#16314d">Khí H₂</text>
    <text x="769" y="342" text-anchor="middle" font-size="14" fill="#5c7c8e">TP-09 · cấp nhà máy</text>
    <text x="769" y="360" text-anchor="middle" font-size="14" fill="#5c7c8e">H₂O₂</text>
  </g>

  <!-- ===== mũi tên ===== -->
  <g stroke="#1f6a99" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path d="M 210 133 L 240 133"/>
    <path d="M 426 133 L 456 133"/>
    <path d="M 642 133 L 672 133"/>
    <path d="M 552 176 L 552 226 L 552 254"/>
    <path d="M 462 329 L 432 329"/>
    <path d="M 642 329 L 672 329"/>
  </g>
  <g stroke="#5c7c8e" stroke-width="1.4" fill="none" marker-end="url(#arw2)" stroke-dasharray="5 4">
    <path d="M 552 226 L 336 226 L 336 280"/>
  </g>

  <text x="228" y="124" text-anchor="middle" font-size="13" fill="#5c7c8e">thô</text>
  <text x="441" y="124" text-anchor="middle" font-size="13" fill="#5c7c8e">bụi</text>
  <text x="657" y="116" text-anchor="middle" font-size="13" fill="#5c7c8e">CH₄</text>
  <text x="566" y="200" font-size="13" fill="#5c7c8e">khí sau hấp phụ</text>
  <text x="447" y="312" text-anchor="middle" font-size="13" fill="#5c7c8e">tái sinh</text>
  <text x="657" y="312" text-anchor="middle" font-size="13" fill="#5c7c8e">H₂</text>

  <!-- ===== chú giải ===== -->
  <g font-size="13" fill="#5c7c8e">
    <rect x="20" y="392" width="16" height="10" rx="2" fill="#ffffff" stroke="#1f6a99" stroke-width="1.8"/>
    <text x="44" y="401">Thiết bị chính</text>
    <rect x="160" y="392" width="16" height="10" rx="2" fill="#eef4f9" stroke="#1f6a99" stroke-width="1.2"/>
    <text x="184" y="401">Dòng sản phẩm</text>
    <line x1="310" y1="397" x2="342" y2="397" stroke="#1f6a99" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="350" y="401">Dòng chính</text>
    <line x1="452" y1="397" x2="484" y2="397" stroke="#5c7c8e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw2)"/>
    <text x="492" y="401">Dòng phụ</text>
  </g>
</svg>
</body>
</html>

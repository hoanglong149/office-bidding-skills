<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sơ đồ bước · bản in</title>
  <style>
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #16314d;
      --color-muted:  #5c7c8e;
      --color-accent: #1f6a99;
    }
    body { margin: 0; background: var(--color-paper); }
  </style>
</head>
<body>
<svg viewBox="0 0 880 480" width="880" height="480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="flow-title flow-desc" font-family="Arial, sans-serif">
  <title id="flow-title">Lưu trình công nghệ</title>
  <desc id="flow-desc">Năm bước công nghệ nối tiếp, có một nhánh thu hồi phụ.</desc>

  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6a99"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c7c8e"/>
    </marker>
  </defs>

  <!-- ===== dải bước ===== -->
  <g font-size="15" fill="#5c7c8e" text-anchor="middle">
    <text x="180" y="34">1 · ĐO ĐẾM</text>
    <text x="330" y="34">2 · NÉN KHÍ</text>
    <text x="480" y="34">3 · HẤP PHỤ</text>
    <text x="630" y="34">4 · TÁCH CH₄</text>
    <text x="780" y="34">5 · CHƯNG CẤT</text>
  </g>

  <!-- ===== làn 1: khí đầu vào ===== -->
  <g>
    <line x1="20" y1="58" x2="860" y2="58" stroke="#dfe6ec" stroke-width="1"/>
    <text x="20" y="112" font-size="15" font-weight="600" fill="#5c7c8e">KHÍ ĐẦU VÀO</text>
    <rect x="100" y="66" width="160" height="76" rx="6" fill="#ffffff" stroke="#5c7c8e" stroke-width="1.2"/>
    <text x="180" y="96" text-anchor="middle" font-size="18" font-weight="600" fill="#16314d">Khí Off-Gas</text>
    <text x="180" y="120" text-anchor="middle" font-size="14" fill="#5c7c8e">TP-01 · 15,1 barg</text>
  </g>

  <!-- ===== làn 2: làm sạch ===== -->
  <g>
    <line x1="20" y1="152" x2="860" y2="152" stroke="#dfe6ec" stroke-width="1"/>
    <text x="20" y="206" font-size="15" font-weight="600" fill="#5c7c8e">LÀM SẠCH</text>
    <rect x="250" y="160" width="160" height="76" rx="6" fill="#ffffff" stroke="#5c7c8e" stroke-width="1.2"/>
    <text x="330" y="190" text-anchor="middle" font-size="18" font-weight="600" fill="#16314d">Cụm đo đếm</text>
    <text x="330" y="214" text-anchor="middle" font-size="14" fill="#5c7c8e">lọc bụi · lưu lượng</text>
  </g>

  <!-- ===== làn 3: hấp phụ ===== -->
  <g>
    <line x1="20" y1="246" x2="860" y2="246" stroke="#dfe6ec" stroke-width="1"/>
    <text x="20" y="300" font-size="15" font-weight="600" fill="#5c7c8e">HẤP PHỤ</text>
    <rect x="400" y="254" width="160" height="76" rx="6" fill="#ffffff" stroke="#1f6a99" stroke-width="1.8"/>
    <text x="480" y="284" text-anchor="middle" font-size="18" font-weight="600" fill="#16314d">PSA sơ cấp</text>
    <text x="480" y="308" text-anchor="middle" font-size="14" fill="#5c7c8e">10-T-6001</text>
  </g>

  <!-- ===== làn 4: tách và sản phẩm ===== -->
  <g>
    <line x1="20" y1="340" x2="860" y2="340" stroke="#dfe6ec" stroke-width="1"/>
    <text x="20" y="394" font-size="15" font-weight="600" fill="#5c7c8e">SẢN PHẨM</text>
    <rect x="550" y="348" width="150" height="76" rx="6" fill="#eef4f9" stroke="#1f6a99" stroke-width="1.2"/>
    <text x="625" y="378" text-anchor="middle" font-size="18" font-weight="600" fill="#16314d">Khí CH₄</text>
    <text x="625" y="402" text-anchor="middle" font-size="14" fill="#5c7c8e">tuần hoàn xưởng</text>

    <rect x="720" y="348" width="140" height="76" rx="6" fill="#eef4f9" stroke="#1f6a99" stroke-width="1.2"/>
    <text x="790" y="378" text-anchor="middle" font-size="18" font-weight="600" fill="#16314d">Khí H₂</text>
    <text x="790" y="402" text-anchor="middle" font-size="14" fill="#5c7c8e">nhà máy H₂O₂</text>
  </g>

  <!-- ===== mũi tên ===== -->
  <g stroke="#1f6a99" stroke-width="1.6" fill="none" marker-end="url(#fa)">
    <path d="M 260 104 L 300 104 L 300 156"/>
    <path d="M 410 198 L 460 198 L 460 250"/>
    <path d="M 560 292 L 600 292 L 600 344"/>
    <path d="M 700 386 L 716 386"/>
  </g>
  <g stroke="#5c7c8e" stroke-width="1.4" fill="none" marker-end="url(#fb)" stroke-dasharray="5 4">
    <path d="M 480 330 L 480 348 L 500 348"/>
  </g>

  <text x="306" y="150" font-size="13" fill="#5c7c8e">thô</text>
  <text x="470" y="244" font-size="13" fill="#5c7c8e">sạch bụi</text>
  <text x="612" y="332" font-size="13" fill="#5c7c8e">CH₄</text>
  <text x="508" y="344" font-size="13" fill="#5c7c8e">nhánh phụ</text>

  <!-- ===== chú giải ===== -->
  <g font-size="13" fill="#5c7c8e">
    <rect x="20" y="452" width="16" height="10" rx="2" fill="#ffffff" stroke="#1f6a99" stroke-width="1.8"/>
    <text x="44" y="461">Thiết bị chính</text>
    <rect x="160" y="452" width="16" height="10" rx="2" fill="#eef4f9" stroke="#1f6a99" stroke-width="1.2"/>
    <text x="184" y="461">Dòng sản phẩm</text>
    <line x1="310" y1="457" x2="342" y2="457" stroke="#1f6a99" stroke-width="1.6" marker-end="url(#fa)"/>
    <text x="350" y="461">Dòng chính</text>
    <line x1="452" y1="457" x2="484" y2="457" stroke="#5c7c8e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fb)"/>
    <text x="492" y="461">Dòng phụ</text>
  </g>
</svg>
</body>
</html>
